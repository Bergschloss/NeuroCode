<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Neurocode Studio · Logo Variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  html,body{background:#0a0a0a;margin:0;color:#e6e9f2;font-family:Inter,sans-serif}
</style>
</head>
<body>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="logos/Logo.jsx"></script>

<div id="root"></div>

<script type="text/babel">
function App() {
  const V = window.LogoComponents;
  const variants = window.LogoVariants;

  const sections = [
    { id:'flow',     title:'01 — Organic / flow',        slice:[0,7]  },
    { id:'geo',      title:'02 — Geometric / spatial',    slice:[7,14] },
    { id:'motion',   title:'03 — Active / motion',        slice:[14,20] },
  ];

  return (
    <DesignCanvas
      title="NEUROCODE STUDIO"
      subtitle="20 abstract animated symbol marks · monochrome · SMIL motion"
    >
      {sections.map(s => (
        <DCSection key={s.id} id={s.id} title={s.title}>
          {variants.slice(s.slice[0], s.slice[1]).map(v => (
            <DCArtboard key={v.key} id={v.key} label={v.name} width={340} height={260}>
              {React.createElement(V[v.key])}
            </DCArtboard>
          ))}
        </DCSection>
      ))}
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
